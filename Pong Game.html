<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="Pong Game.css">
</head>
<body>
    <div class="container">
        <h1>🏓 PONG GAME 🏓</h1>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <div class="scoreboard">
            <div>
                <div>Player (Left)</div>
                <div class="score" id="playerScore">0</div>
            </div>
            <div>
                <div>Computer (Right)</div>
                <div class="score" id="computerScore">0</div>
            </div>
        </div>

        <div class="instructions">
            <h3>How to Play:</h3>
            <p>🖱️ <strong>Mouse:</strong> Move your paddle up and down</p>
            <p>⬆️ ⬇️ <strong>Arrow Keys:</strong> Move your paddle up and down</p>
            <p>First to 5 points wins!</p>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <script src="Pong Game.js"></script>
        

</body>
</html>
